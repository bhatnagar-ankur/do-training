<!DOCTYPE html>
<html>

<head>
    <title>ToDo List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            padding-top: 40px;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 500px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        input {
            width: 70%;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px;
            font-size: 18px;
            cursor: pointer;
        }


        ul,
        #completedTasks {
            margin-top: 20px;
            min-height: 150px;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 6px;
        }

        li {
            background: #f9f9f9;
            margin: 5px 0;
            padding: 10px;
            border-radius: 5px;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .error {
            color: red;
        }

        i.fa-trash {
            color: red;
            cursor: pointer;
        }
        .lists-wrapper {
    display: flex;
    gap: 20px;
    margin-top: 20px;
}

#divContainer, #completedTasks {
    flex: 1;
}
    </style>
</head>

<body>

    <div class="container">
        <h1>TO DO LIST</h1>
        <input type="text" id="task" placeholder="Enter Task">
        <button type="submit" id="add" onclick="newElement()">
            <i class="fa fa-calendar-plus-o" style="font-size:24px"></i>
        </button>
        <span id="errorMsg" class="error"></span>

        <div class="lists-wrapper">
            
            <div id="divContainer">
                <h3>To Do Tasks</h3>
                <ul id="listItems" ondragover="allowDrop(event)" ondrop="drop(event)">
                </ul>
            </div>

             
            <div id="completedTasks" ondragover="allowDrop(event)" ondrop="drop(event)">
                <h3>Completed Tasks</h3>
            </div>
        </div>
    </div>

    <script>
        let taskId = 0;

        function newElement() {
            const taskInput = document.getElementById("task");
            const taskText = taskInput.value.trim();
            const errorMsg = document.getElementById("errorMsg");

            if (taskText === "") {
                errorMsg.textContent = "Task cannot be empty!";
                return;
            } else {
                errorMsg.textContent = "";
            }

            const list = document.getElementById("listItems");
            const li = document.createElement("li");
            li.className = "item";
            li.textContent = taskText;
            li.setAttribute("draggable", "true");
            li.id = "task-" + taskId++;
            li.addEventListener("dragstart", drag);

            const btn = document.createElement("button");
            btn.innerHTML = '<i class="fas fa-trash"></i>';
            btn.style.marginLeft = "20px";

            btn.addEventListener('click', function () {
                li.remove();
            });

            li.appendChild(btn);
            list.appendChild(li);
            taskInput.value = "";
        }

        function drag(event) {
            event.dataTransfer.setData("text/plain", event.target.id);
        }

        function allowDrop(event) {
            event.preventDefault();
        }

        function drop(event) {
            event.preventDefault();
            const draggedId = event.dataTransfer.getData("text/plain");
            const draggedElement = document.getElementById(draggedId);

            // Walk up the DOM to find the correct drop target
            let dropZone = event.target;
            while (dropZone && !dropZone.matches("#listItems, #completedTasks")) {
                dropZone = dropZone.parentElement;
            }

            if (dropZone && draggedElement) {
                dropZone.appendChild(draggedElement);
            }
        }
    </script>

</body>

</html>
