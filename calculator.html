<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Calculator</title>
  <style>
    body{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:rgb(172, 170, 169);
    }
    .calculator{
      padding:10px;
      background:#20201f;
      border-radius:5px;
    }
    #display{
      width:280px;
      height:50px;
      text-align:right;
      margin-bottom:10px;
      font-size:20px;
    }
    .buttons{
      display:grid;
      grid-template-columns:repeat(4,70px);
      gap:5px;
    }
    button{
      height:50px;
      font-size:20px;
      background:#555;
      color:white;
      border-radius: 5px;
    }
    .equal{ grid-column:span 2; background:#11b102; }
    .clear{ grid-column:span 2; background:#be430a; }
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" disabled>
    <div class="buttons">
      <button onclick="press('1')">1</button>
      <button onclick="press('2')">2</button>
      <button onclick="press('3')">3</button>
      <button onclick="press('+')">+</button>
      <button onclick="press('4')">4</button>
      <button onclick="press('5')">5</button>
      <button onclick="press('6')">6</button>
      <button onclick="press('*')">×</button>
      <button onclick="press('7')">7</button>
      <button onclick="press('8')">8</button>
      <button onclick="press('9')">9</button>
      <button onclick="press('/')">÷</button>
      <button onclick="press('-')">−</button>
      <button onclick="press('0')">0</button>
      <button onclick="press('.')">.</button>
      <button onclick="calculate()" class="equal">=</button>
      <button onclick="clearDisplay()" class="clear">C</button>
    </div>
  </div>

  <script>
    let display = document.getElementById("display");

function press(val){
  display.value += val;
}

function clearDisplay(){
  display.value = "";
}

function calculate(){
  let exp = display.value;
  let numbers = [];
  let operators = [];
  let current = "";
  for(let i=0;i<exp.length;i++){
    let ch = exp[i];
    if(ch === "+" || ch === "-" || ch === "*" || ch === "/"){
      numbers.push(parseFloat(current));
      operators.push(ch);
      current = "";
    } else {
      current += ch;
    }
  }
  numbers.push(parseFloat(current)); // last number

  let result = numbers[0];
  for(let i=0;i<operators.length;i++){
    let op = operators[i];
    let num = numbers[i+1];
    if(op === "+") result += num;
    else if(op === "-") result -= num;
    else if(op === "*") result *= num;
    else if(op === "/") result = num===0 ? "Error" : result / num;
  }

  display.value = result;
}
  </script>
</body>
</html>
