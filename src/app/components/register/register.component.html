<div class="register-container">
  <mat-card class="register-card">
    <mat-card-header>
      <mat-card-title>Register</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
        <div *ngIf="formData">
          <div *ngFor="let field of formData.fields" class="form-field">
            
           
            <mat-form-field appearance="outline" *ngIf="['text', 'number', 'email', 'date', 'password'].includes(field.type)">
              <mat-label>{{ field.label }}</mat-label>
              <input matInput [type]="field.type" [formControlName]="field.name" [placeholder]="field.placeholder || ''">
            </mat-form-field>

          
            <mat-form-field appearance="outline" *ngIf="field.type === 'textarea'">
              <mat-label>{{ field.label }}</mat-label>
              <textarea matInput [formControlName]="field.name" [placeholder]="field.placeholder || ''"></textarea>
            </mat-form-field>

            
            <mat-form-field appearance="outline" *ngIf="field.type === 'select'">
              <mat-label>{{ field.label }}</mat-label>
              <mat-select [formControlName]="field.name">
                <mat-option *ngFor="let option of field.options" [value]="option">{{ option }}</mat-option>
              </mat-select>
            </mat-form-field>

          
            <div class="file-upload" *ngIf="field.type === 'file'">
              <label>{{ field.label }}</label>
              <input type="file" [formControlName]="field.name">
            </div>

          </div>
        </div>
        <div *ngIf="registerForm.errors?.['passwordMismatch']" class="error-message">
          Passwords do not match.
        </div>
        
        <button mat-raised-button color="primary" class="submit-btn" type="submit">Register</button>
      </form>
    </mat-card-content>
    <mat-card-actions class="register-link">
      <p> Already have an account? 
        <button mat-button color="accent" (click)="navigateToLogin()">Already Registered </button>
      </p>
    </mat-card-actions>
  </mat-card>
</div>
