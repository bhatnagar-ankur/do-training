<mat-card class="leave-card">
    <mat-card-title>Leave Request</mat-card-title>
    <form [formGroup]="leaveForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="fill">
        <mat-label>Employee Name</mat-label>
        <input matInput formControlName="employeeName" />
      </mat-form-field>
  
      <mat-form-field appearance="fill">
        <mat-label>Leave Type</mat-label>
        <mat-select formControlName="leaveType">
          <mat-option value="sick">Sick Leave</mat-option>
          <mat-option value="vacation">Vacation</mat-option>
          <mat-option value="personal">Personal Leave</mat-option>
        </mat-select>
      </mat-form-field>
  
      <mat-form-field appearance="fill">
        <mat-label>Start Date</mat-label>
        <input matInput type="date" formControlName="startDate" />
      </mat-form-field>
  
      <mat-form-field appearance="fill">
        <mat-label>End Date</mat-label>
        <input matInput type="date" formControlName="endDate" />
      </mat-form-field>
  
      <mat-form-field appearance="fill">
        <mat-label>Reason</mat-label>
        <textarea matInput formControlName="reason"></textarea>
      </mat-form-field>
  
      <button mat-raised-button color="primary" type="submit">Submit</button>
    </form>
  </mat-card>
