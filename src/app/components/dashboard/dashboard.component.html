<div class="dashboard-container">
    
    <div class="dashboard-summary">
      <div class="card">
        <h3>Total Employees</h3>
        <p>{{ employeeCount }}</p>
      </div>
      <div class="card">
        <h3>Active Projects</h3>
        <p>{{ activeProjects }}</p>
      </div>
      <div class="card">
        <h3>Pending Leaves</h3>
        <p>{{ pendingLeaves }}</p>
      </div>
    </div>
  
   
    <div class="Calendar">
      <h2>Timesheet Overview</h2>
      <img src="assets/timesheet-placeholder.png" alt="Timesheet Calendar">
    </div>
  
    
    <div class="recent-activity">
      <h2>Recent Activities</h2>
      <ul>
        <li *ngFor="let activity of recentActivities">
          <strong>{{ activity.user }}</strong> - {{ activity.action }} <span class="time">{{ activity.time }}</span>
        </li>
      </ul>
    </div>
  </div>
