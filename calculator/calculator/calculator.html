<!DOCTYPE html>
<html lang="en">
<title>Calculator</title>
 
<head>
    <link rel="stylesheet" href="calculator.css">
    <script defer src="calculator.js"></script>
</head>
 
<body>
    <div class="calculator"> CALCULATOR
        <input type="text" id="display" placeholder="0" readonly>
        <div class="buttons">
            <button  onclick="append(7)">7</button>
            <button  onclick="append(8)">8</button>
            <button  onclick="append(9)">9</button>
            <button  onclick="deleteLast()" style="background-color: red;">DEL</button>
 
            <button  onclick="append(4)">4</button>
            <button  onclick="append(5)">5</button>
            <button  onclick="append(6)">6</button>
            <button  onclick="append('+')">+</button>
 
            <button  onclick="append(1)">1</button>
            <button  onclick="append(2)">2</button>
            <button  onclick="append(3)">3</button>
            <button  onclick="append('-')">-</button>
 
            <button  onclick="append('.')">.</button>
            <button  onclick="append(0)">0</button>
            <button  onclick="append('/')">/</button>
            <button  onclick="append('*')">*</button>
            
            <button  onclick="clearDisplay()" style="background-color: orangered;width: 43%;">AC</button>
            <button  onclick="calculate()" style="background-color: green; width: 44%;">=</button>
        </div> 
    </div> 
 
</html>
